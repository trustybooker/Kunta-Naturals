name: Kunta Naturals Site Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate static site
        run: node scripts/validate-static-site.mjs
