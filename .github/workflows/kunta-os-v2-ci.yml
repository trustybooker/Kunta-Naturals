name: Kunta OS v2 CI

on:
  pull_request:
    paths:
      - 'kunta-os-v2/**'
      - '.github/workflows/kunta-os-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'kunta-os-v2/**'
      - '.github/workflows/kunta-os-v2-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kunta-os-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kunta-os-v2/package-lock.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
