name: Kunta OS v2 CI

on:
  pull_request:
    paths:
      - 'kunta-os-v2/**'
      - '.github/workflows/kunta-os-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'kunta-os-v2/**'
      - '.github/workflows/kunta-os-v2-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kunta-os-v2
    steps:
      - name: Checkout quietly
        working-directory: .
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install
        run: npm install --no-audit --silent
      - name: Typecheck
        run: npm run typecheck --silent
      - name: Build
        run: npm run build --silent
